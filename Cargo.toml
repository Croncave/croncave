[workspace]
members = ["crates/telemetry"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Shared versions, so every crate in the workspace agrees on one.
# Add a dependency here the first time a second crate needs it.
[workspace.dependencies]
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.49"
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Warn on the patterns that hide real failures in a long-running service.
# CI turns warnings into errors.
unwrap_used = "warn"
expect_used = "warn"
