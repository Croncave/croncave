[workspace]
members = [
    "crates/agent",
    "crates/compute",
    "crates/control-plane",
    "crates/db",
    "crates/protocol",
    "crates/relay",
    "crates/telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Shared versions, so every crate in the workspace agrees on one.
# Add a dependency here the first time a second crate needs it.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
bollard = "0.21"
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.49"
rand = "0.10"
serde_json = "1"
sha2 = "0.11"
# rustls, never native-tls: nothing in the tree should need OpenSSL.
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
    "time",
] }
thiserror = "2"
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["compat", "io"] }
time = { version = "0.3", features = ["serde-well-known"] }
tokio = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id"] }
uuid = { version = "1", features = ["serde", "v7"] }
yamux = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Warn on the patterns that hide real failures in a long-running service.
# CI turns warnings into errors.
unwrap_used = "warn"
expect_used = "warn"
