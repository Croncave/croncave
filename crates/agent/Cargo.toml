[package]
name = "croncave-agent"
description = "The binary inside a workspace. It dials out, and never listens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
croncave-protocol = { path = "../protocol" }
croncave-telemetry = { path = "../telemetry" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
yamux.workspace = true
