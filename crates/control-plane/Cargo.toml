[package]
name = "croncave-control-plane"
description = "The API, scheduler and orchestrator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-extra.workspace = true
base64.workspace = true
croncave-compute = { path = "../compute" }
croncave-db = { path = "../db" }
croncave-protocol = { path = "../protocol" }
croncave-relay = { path = "../relay" }
croncave-telemetry = { path = "../telemetry" }
rand.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower-http.workspace = true
tracing.workspace = true

# The binary needs these; the library does not.
[dependencies.anyhow]
workspace = true

[dependencies.dotenvy]
workspace = true

[dependencies.sqlx]
workspace = true

[dev-dependencies]
croncave-compute = { path = "../compute" }
croncave-relay = { path = "../relay" }
tower = { workspace = true, features = ["util"] }
