name: CI

# Jobs switch on automatically as each part of the repository appears: the Rust
# job once a root Cargo.toml exists, the web job once web/package.json exists,
# the end-to-end job once e2e/package.json does. Until then only the repository
# checks run.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.parts.outputs.rust }}
      web: ${{ steps.parts.outputs.web }}
      e2e: ${{ steps.parts.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: parts
        run: |
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          [ -f web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f e2e/package.json ] && echo "e2e=true" >> "$GITHUB_OUTPUT" || echo "e2e=false" >> "$GITHUB_OUTPUT"

  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required context files exist
        run: |
          for f in AGENTS.md CLAUDE.md README.md docs/product-definition.md docs/architecture.md docs/pricing.md docs/delivery.md docs/conventions.md docs/decisions/README.md; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: No committed secrets or env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Env files must not be committed (use .env.example for templates)."; exit 1
          fi

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      # The database tests run against a real Postgres, never a stub.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croncave
          POSTGRES_PASSWORD: croncave
          POSTGRES_DB: croncave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U croncave -d croncave"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://croncave:croncave@localhost:5432/croncave
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The same script developers run locally, so the two can't drift.
      - run: scripts/check.sh rust

  web:
    name: Web
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version is pinned by web/package.json's packageManager
          # field; there is no package.json at the repository root.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The same script developers run locally, so the two can't drift.
      - run: scripts/check.sh web

  e2e:
    name: End to end
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      # A real browser against a real control plane against a real Postgres.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croncave
          POSTGRES_PASSWORD: croncave
          POSTGRES_DB: croncave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U croncave -d croncave"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://croncave:croncave@localhost:5432/croncave
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm run install-browsers
        working-directory: e2e
      # Workspaces run this image; the end-to-end tests start real ones.
      - uses: docker/setup-buildx-action@v3
      - name: Build the workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/workspace/Dockerfile
          tags: croncave/workspace:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The same script developers run locally, so the two can't drift.
      - run: scripts/check.sh e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
