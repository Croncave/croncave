<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton · Croncave design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:#888;font-family:Inter,system-ui,sans-serif} .theme{max-width:960px;margin:0 auto 24px} h2{font:500 12px/16px ui-monospace,monospace;color:#fff;margin:16px auto 8px;max-width:960px;text-transform:uppercase;letter-spacing:.08em}</style>
</head>
<body>
<h2>Light</h2>
<div class="theme" data-theme="light" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:16px;align-items:center;padding:24px;background:var(--surface);">
  <button type="button" class="cc-icon-btn" aria-label="Notifications, 3 unread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span class="cc-icon-btn__badge"></span></button>
  <button type="button" class="cc-icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
  <button type="button" class="cc-icon-btn cc-icon-btn--ghost" aria-label="Quick stats for Daily News Digest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-3"></path><path d="M12 16V9"></path><path d="M17 16v-6"></path></svg></button>
</div>
</div>
<h2>Dark</h2>
<div class="theme" data-theme="dark" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:16px;align-items:center;padding:24px;background:var(--surface);">
  <button type="button" class="cc-icon-btn" aria-label="Notifications, 3 unread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span class="cc-icon-btn__badge"></span></button>
  <button type="button" class="cc-icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
  <button type="button" class="cc-icon-btn cc-icon-btn--ghost" aria-label="Quick stats for Daily News Digest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-3"></path><path d="M12 16V9"></path><path d="M17 16v-6"></path></svg></button>
</div>
</div>
</body>
</html>
