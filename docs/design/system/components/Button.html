<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Croncave design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:#888;font-family:Inter,system-ui,sans-serif} .theme{max-width:960px;margin:0 auto 24px} h2{font:500 12px/16px ui-monospace,monospace;color:#fff;margin:16px auto 8px;max-width:960px;text-transform:uppercase;letter-spacing:.08em}</style>
</head>
<body>
<h2>Light</h2>
<div class="theme" data-theme="light" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:12px;align-items:center;padding:24px;background:var(--surface);">
  <button class="cc-btn cc-btn--primary" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Create workspace
  </button>
  <button class="cc-btn cc-btn--secondary" type="button">Set up manually</button>
  <button class="cc-btn cc-btn--ghost" type="button">Cancel</button>
  <button class="cc-btn cc-btn--secondary" type="button" disabled>Disabled</button>
</div>
</div>
<h2>Dark</h2>
<div class="theme" data-theme="dark" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:12px;align-items:center;padding:24px;background:var(--surface);">
  <button class="cc-btn cc-btn--primary" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Create workspace
  </button>
  <button class="cc-btn cc-btn--secondary" type="button">Set up manually</button>
  <button class="cc-btn cc-btn--ghost" type="button">Cancel</button>
  <button class="cc-btn cc-btn--secondary" type="button" disabled>Disabled</button>
</div>
</div>
</body>
</html>
