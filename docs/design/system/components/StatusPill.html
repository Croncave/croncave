<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusPill · Croncave design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:#888;font-family:Inter,system-ui,sans-serif} .theme{max-width:960px;margin:0 auto 24px} h2{font:500 12px/16px ui-monospace,monospace;color:#fff;margin:16px auto 8px;max-width:960px;text-transform:uppercase;letter-spacing:.08em}</style>
</head>
<body>
<h2>Light</h2>
<div class="theme" data-theme="light" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:24px;background:var(--surface);">
  <span class="cc-pill cc-pill--live">Live</span>
  <span class="cc-pill cc-pill--working">Working</span>
  <span class="cc-pill cc-pill--needs">Needs you</span>
  <span class="cc-pill cc-pill--asleep">Asleep</span>
  <span class="cc-pill cc-pill--failed">Failed</span>
</div>
</div>
<h2>Dark</h2>
<div class="theme" data-theme="dark" style="background:var(--bg)">
<div class="cc-root" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:24px;background:var(--surface);">
  <span class="cc-pill cc-pill--live">Live</span>
  <span class="cc-pill cc-pill--working">Working</span>
  <span class="cc-pill cc-pill--needs">Needs you</span>
  <span class="cc-pill cc-pill--asleep">Asleep</span>
  <span class="cc-pill cc-pill--failed">Failed</span>
</div>
</div>
</body>
</html>
