<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavItem · Croncave design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:#888;font-family:Inter,system-ui,sans-serif} .theme{max-width:960px;margin:0 auto 24px} h2{font:500 12px/16px ui-monospace,monospace;color:#fff;margin:16px auto 8px;max-width:960px;text-transform:uppercase;letter-spacing:.08em}</style>
</head>
<body>
<h2>Light</h2>
<div class="theme" data-theme="light" style="background:var(--bg)">
<div class="cc-root" style="width:248px;padding:16px;background:var(--surface-sunken);display:flex;flex-direction:column;gap:2px;">
  <a class="cc-nav-item" href="#" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Home
    <span class="cc-nav-item__count">2</span>
  </a>
  <a class="cc-nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Templates
  </a>
  <div class="cc-label" style="padding:12px 10px 6px;">Workspaces</div>
  <a class="cc-nav-item" href="#"><span class="cc-dot cc-dot--live"></span>Stock Watcher</a>
  <a class="cc-nav-item" href="#"><span class="cc-dot cc-dot--needs"></span>Real Estate App</a>
</div>
</div>

<div class="theme" data-theme="dark" style="background:var(--bg)">
<div class="cc-root" style="width:248px;padding:16px;background:var(--surface-sunken);display:flex;flex-direction:column;gap:2px;">
  <a class="cc-nav-item" href="#" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Home
    <span class="cc-nav-item__count">2</span>
  </a>
  <a class="cc-nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Templates
  </a>
  <div class="cc-label" style="padding:12px 10px 6px;">Workspaces</div>
  <a class="cc-nav-item" href="#"><span class="cc-dot cc-dot--live"></span>Stock Watcher</a>
  <a class="cc-nav-item" href="#"><span class="cc-dot cc-dot--needs"></span>Real Estate App</a>
</div>
</div>

</html>
